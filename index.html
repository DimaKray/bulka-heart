<!doctype html><html lang="uk"><head><meta charset="utf-8"><title>Серце з частинок</title><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<style>
/* Layout: one full-bleed WebGL canvas, nothing else. Deliberately single dark look, so colors live on bare :root. */
:root {
  --bg: #07030a;
  --fg: #f9c8e2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  overflow: hidden;
}
#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  background: var(--bg);
  touch-action: none;
  cursor: grab;
}
#stage.grabbing { cursor: grabbing; }
#stage:focus-visible { outline: 2px solid var(--fg); outline-offset: -4px; }
#nogl[hidden] { display: none; }
#nogl {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding-inline: 16px;
  text-align: center;
  font-size: 1rem;
}
</style>

<canvas id="stage" role="button" tabindex="0" aria-label="Тривимірне серце з частинок. Натисни Enter, щоб розсипати його."></canvas>
<p id="nogl" hidden>Для цієї сторінки потрібен WebGL, а в цьому браузері він вимкнений.</p>

<script>
(() => {
  'use strict';
  const cv = document.getElementById('stage');
  const gl = cv.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'high-performance' });
  if (!gl) { document.getElementById('nogl').hidden = false; cv.hidden = true; return; }
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const smooth = (a, b, v) => { const x = clamp((v - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };

  /* ---------- shaders ---------- */
  const VS = `
    precision highp float;
    attribute vec3 aHeart;   // heart surface point (y is up, z is depth)
    attribute vec4 aV;       // x: funnel phase, y: spiral offset, z: random, w: 1 = small base vortex
    attribute vec4 aR;       // x: build delay, y: size, z: color, w: random
    attribute vec4 aSil;
    attribute vec3 aText;    // where this particle sits in the lettering
    uniform float uTime, uProg, uBeat, uRotY, uRotX, uBurstT, uS, uDPR, uSize, uIntro, uBoost, uMorph, uTextScale, uSil, uSilScale;
    uniform vec2 uView, uCenter;
    uniform vec3 uC0, uC1, uC2;
    varying vec3 vCol;
    varying float vA;
    const float PI = 3.14159265;
    const float TAU = 6.2831853;
    const float FOV = 3.4;

    void main() {
      float t = uTime;
      vec3 p;
      float alpha;
      float tw = 0.75 + 0.25 * sin(t * (2.0 + aR.y * 0.4) + aR.w * TAU * 3.0);
      float a0 = 0.5 + 0.5 * fract(aR.w * 91.7);
      float mm = 0.0;
      float silMs = 0.0;
      float silInt = step(10.0, aSil.w);
      float silW = aSil.w - 10.0 * silInt;
      float sizeMul = 1.0;

      if (aV.w < 0.5) {
        // particle of the big vortex that becomes the heart
        float m = clamp((uProg - aR.x * 0.55) / 0.45, 0.0, 1.0);
        float e = m * m * (3.0 - 2.0 * m);
        float tau = 2.2;
        float flow = 0.35 * tau * (1.0 - exp(-t / tau));
        float h = fract(aV.x + flow);
        float yv = mix(-1.4, 1.65, h) + (fract(aR.w * 17.9) - 0.5) * 0.25;
        float rv = (0.05 + pow(h, 1.6)) * (0.75 + 0.5 * fract(aR.w * 37.1));
        mm = clamp((uMorph - aV.z * 0.4) / 0.6, 0.0, 1.0);
        mm = mm * mm * (3.0 - 2.0 * mm);
        vec3 hHeart = aHeart * uBeat * (1.0 + 0.02 * sin(t * 1.4 + aR.w * TAU));
        vec3 hText = (aText * uTextScale + vec3(0.0, 0.15, 0.0)) * (1.0 + 0.006 * sin(t * 1.4 + aR.w * TAU));
        float ms = clamp((uSil - aV.z * 0.4) / 0.6, 0.0, 1.0);
        ms = ms * ms * (3.0 - 2.0 * ms);
        silMs = ms;
        vec3 hSil = aSil.xyz * uSilScale * (1.0 + 0.008 * sin(t * 1.4 + aR.w * TAU));
        vec3 hp = mix(mix(hHeart, hText, mm), hSil, ms);
        float ah = atan(hp.z, hp.x);
        float rh = length(hp.xz);
        float omega = 2.0 + 0.2 * (fract(aR.w * 53.3) - 0.5);
        float ang = ah + (1.0 - e) * (aV.y + t * omega);
        float r = mix(rv, rh, e);
        float y = mix(yv, hp.y, e);
        p = vec3(cos(ang) * r, y, sin(ang) * r);
        if (uBurstT > 0.0) {
          vec3 rnd = vec3(fract(aR.w * 7.31), fract(aR.w * 13.7), fract(aR.w * 3.9)) - 0.5;
          vec3 dir = normalize(aHeart + rnd * 0.8);
          float amp = 4.5 * uBurstT * exp(-1.4 * uBurstT) * (1.0 - smoothstep(3.5, 5.5, uBurstT));
          p += dir * amp * (0.5 + fract(aR.w * 17.3)) * e;
        }
        float fade = smoothstep(0.0, 0.12, h) * smoothstep(1.0, 0.88, h);
        float wv = 0.5 + 0.5 * sin(length(hp.xy - vec2(0.0, -0.9)) * 3.4 - t * 3.2);
        alpha = mix(a0, 0.85, ms) * mix(fade, 1.0, e) * (1.0 + 0.2 * mm + 3.0 * ms) * (1.0 + 0.9 * mm * (1.0 - ms) * wv * wv) * mix(1.0, silW * smoothstep(-1.0, -0.4, aSil.y), ms);
        sizeMul = mix(1.0 - 0.15 * mm, 2.2 / aR.y, ms);
      } else {
        // small vortex that keeps feeding the heart from below
        float h = fract(aV.x + t * 0.16);
        float y = mix(-1.4, mix(-0.3, -0.75, uMorph), h);
        float r = ((0.6 + 0.3 * uMorph) * pow(1.0 - h, 1.5) + 0.03) * (0.8 + 0.4 * fract(aR.w * 37.1));
        float ang = aV.y + t * (2.2 + 2.4 * h);
        p = vec3(cos(ang) * r, y, sin(ang) * r);
        // in lettering mode the funnel's top pours out in a spiral arc onto the letters
        float sp = smoothstep(0.45, 1.0, h) * uMorph;
        float se = sp * sp * (3.0 - 2.0 * sp);
        vec3 tp = mix(aText * uTextScale + vec3(0.0, 0.15, 0.0), aSil.xyz * uSilScale, uSil);
        p = mix(p, tp, se) + vec3(cos(ang), 0.0, sin(ang)) * 0.3 * sin(PI * se);
        if (uBurstT > 0.0) {
          vec3 rnd = vec3(fract(aR.w * 7.31), fract(aR.w * 13.7), fract(aR.w * 3.9)) - 0.5;
          vec3 dir = normalize(p + vec3(0.0, 0.5, 0.0) + rnd * 0.8);
          float amp = 4.5 * uBurstT * exp(-1.4 * uBurstT) * (1.0 - smoothstep(3.5, 5.5, uBurstT));
          p += dir * amp * (0.5 + fract(aR.w * 17.3)) * 1.3;
        }
        float aVort = a0 * 1.7 * pow(sin(PI * h), 0.6);
        float aLet = a0 * 1.6 * smoothstep(0.0, 0.15, h) * (1.0 - smoothstep(0.9, 1.0, h));
        alpha = mix(aVort, aLet, uMorph * smoothstep(0.3, 0.6, h));
        alpha *= 1.0 - 0.9 * uSil;
      }

      float ca = cos(uRotY), sa = sin(uRotY), cb = cos(uRotX), sb = sin(uRotX);
      float x1 = p.x * ca + p.z * sa;
      float z1 = -p.x * sa + p.z * ca;
      float y2 = p.y * cb + z1 * sb;
      float z2 = -p.y * sb + z1 * cb;
      float k = FOV / (FOV + z2);
      vec2 px = vec2(x1, y2) * k * uS;
      gl_Position = vec4(uCenter + px / (uView * 0.5), 0.0, 1.0);
      gl_PointSize = max(1.0, aR.y * sizeMul * k * uSize * uDPR);
      float dn = clamp(0.5 - z2 * 0.38, 0.0, 1.0);
      float facing = ca * cb;
      float visS = smoothstep(-0.35, 0.35, -sign(aSil.z) * facing) * 2.2;
      float visI = 0.1 + 0.6 * (1.0 - smoothstep(0.15, 0.85, abs(facing)));
      float vis = mix(visS, visI, silInt);
      vA = alpha * mix(1.0, vis, silMs) * (0.3 + 0.7 * dn) * tw * uIntro * uBoost;
      float ct = aR.z;
      vCol = ct < 0.5 ? mix(uC0, uC1, ct * 2.0) : mix(uC1, uC2, (ct - 0.5) * 2.0);
    }`;
  const FS = `
    precision mediump float;
    varying vec3 vCol;
    varying float vA;
    void main() {
      vec2 c = gl_PointCoord - 0.5;
      float d = length(c) * 2.0;
      if (d > 1.0) discard;
      float g = pow(1.0 - d, 1.5);
      float core = smoothstep(0.4, 0.0, d);
      vec3 col = mix(vCol, vec3(1.0), core * 0.65);
      gl_FragColor = vec4(col, g * vA * (0.55 + 0.45 * core));
    }`;
  const GVS = `
    attribute vec2 p;
    void main() { gl_Position = vec4(p, 0.0, 1.0); }`;
  const GFS = `
    precision mediump float;
    uniform vec2 uC, uR;
    uniform float uK;
    uniform vec3 uColor;
    void main() {
      vec2 q = (gl_FragCoord.xy - uC) / uR;
      float d = dot(q, q);
      float g = exp(-d * 3.0);
      float core = exp(-d * 14.0);
      vec3 col = mix(uColor, vec3(1.0, 0.85, 0.93), core * 0.8);
      gl_FragColor = vec4(col, clamp(g * uK * 0.85, 0.0, 1.0));
    }`;

  const BVS = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.0,1.0); }`;
  const BFS = `
    precision mediump float;
    uniform vec2 uR, uC, uPar;
    uniform float uT, uRing, uFx;
    void main() {
      vec2 q = gl_FragCoord.xy / uR + uPar * 0.03;
      float n = sin(q.x*3.0 + uT*0.10) * sin(q.y*4.0 - uT*0.13) + 0.6*sin((q.x+q.y)*5.0 + uT*0.07);
      vec3 col = vec3(0.32,0.04,0.24) * max(n,0.0) * 0.10 + vec3(0.05,0.02,0.16) * max(-n,0.0) * 0.12;
      float v = length(q - 0.5);
      col *= 1.0 - v * 0.9;
      if (uRing >= 0.0) {
        vec2 v = (gl_FragCoord.xy - uC) / uR.y;
        float d = length(v), a = 0.0, w;
        if (uFx < 0.5) {            // 0: shockwave ring
          w = (d - uRing * 1.3) * 16.0; a = exp(-w*w);
        } else if (uFx < 1.5) {     // 1: soft spiral swirl
          float sp = sin(atan(v.y, v.x) * 2.0 + d * 9.0 - uRing * 7.0);
          a = smoothstep(0.5, 1.0, sp) * smoothstep(uRing * 1.5, uRing * 0.4, d) * smoothstep(0.0, 0.06, d) * 0.7;
        } else {                    // 2: expanding heart outline
          vec2 h = v / (0.12 + uRing * 1.1); h.y += 0.3;
          float hd = h.x*h.x + pow(h.y - pow(abs(h.x), 0.6667), 2.0);
          w = (sqrt(hd) - 1.0) * 7.0; a = exp(-w*w);
        }
        col += vec3(1.0,0.45,0.75) * a * (1.0 - uRing) * 0.6;
      }
      gl_FragColor = vec4(col, 1.0);
    }`;
  const SVS = `
    precision highp float;
    attribute vec3 s;
    uniform float uT, uDPR;
    uniform vec2 uPar;
    varying float vA;
    void main() {
      vec2 f = fract(s.xy * 0.5 + 0.5 + vec2(0.0, uT * 0.004 * (0.3 + s.z)));
      gl_Position = vec4(f * 2.0 - 1.0 + uPar * (0.01 + 0.05 * s.z), 0.0, 1.0);
      gl_PointSize = (1.0 + 2.2 * s.z) * uDPR;
      vA = (0.15 + 0.5 * s.z) * (0.5 + 0.5 * sin(uT * (1.0 + s.z * 3.0) + s.x * 40.0));
    }`;
  const SFS = `
    precision mediump float;
    varying float vA;
    void main() {
      float d = length(gl_PointCoord - 0.5) * 2.0;
      if (d > 1.0) discard;
      gl_FragColor = vec4(1.0, 0.82, 0.93, (1.0 - d) * vA);
    }`;

  function program(vs, fs) {
    const mk = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
      return s;
    };
    const pr = gl.createProgram();
    gl.attachShader(pr, mk(gl.VERTEX_SHADER, vs));
    gl.attachShader(pr, mk(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(pr));
    return pr;
  }
  const P = program(VS, FS);
  const G = program(GVS, GFS);
  const U = {};
  ['uTime', 'uProg', 'uBeat', 'uRotY', 'uRotX', 'uBurstT', 'uS', 'uDPR', 'uSize', 'uIntro', 'uBoost', 'uMorph', 'uTextScale', 'uSil', 'uSilScale', 'uView', 'uCenter', 'uC0', 'uC1', 'uC2']
    .forEach(n => { U[n] = gl.getUniformLocation(P, n); });
  const GU = {};
  ['uC', 'uR', 'uK', 'uColor'].forEach(n => { GU[n] = gl.getUniformLocation(G, n); });
  const aHeart = gl.getAttribLocation(P, 'aHeart');
  const aV = gl.getAttribLocation(P, 'aV');
  const aR = gl.getAttribLocation(P, 'aR');
  const aText = gl.getAttribLocation(P, 'aText');
  const aSil = gl.getAttribLocation(P, 'aSil');
  const gP = gl.getAttribLocation(G, 'p');
  const BG = program(BVS, BFS), ST = program(SVS, SFS);
  const BU = {}; ['uR', 'uC', 'uPar', 'uT', 'uRing', 'uFx'].forEach(n => { BU[n] = gl.getUniformLocation(BG, n); });
  const SU = {}; ['uT', 'uDPR', 'uPar'].forEach(n => { SU[n] = gl.getUniformLocation(ST, n); });
  const bP = gl.getAttribLocation(BG, 'p'), sA = gl.getAttribLocation(ST, 's');
  const NSTAR = 450, starBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, starBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(Array.from({ length: NSTAR * 3 }, () => Math.random() * 2 - 1).map((v, i) => i % 3 === 2 ? (v + 1) / 2 : v)), gl.STATIC_DRAW);
  /* cursor sparks: small CPU-simulated pool */
  const CVS = `attribute vec4 c; uniform vec2 uR; varying float vA;
    void main(){ gl_Position = vec4(c.x / uR.x * 2.0 - 1.0, c.y / uR.y * 2.0 - 1.0, 0.0, 1.0); gl_PointSize = max(c.z, 0.0); vA = c.w; }`;
  const CFS = `precision mediump float; varying float vA;
    void main(){ float d = length(gl_PointCoord - 0.5) * 2.0; if (d > 1.0) discard;
      vec3 col = mix(vec3(0.96,0.45,0.71), vec3(1.0,0.92,0.97), pow(1.0 - d, 3.0));
      gl_FragColor = vec4(col, pow(1.0 - d, 1.6) * vA); }`;
  const CP = program(CVS, CFS), cU = gl.getUniformLocation(CP, 'uR'), cA = gl.getAttribLocation(CP, 'c');
  const NP = 500, spBuf = gl.createBuffer(), spOut = new Float32Array(NP * 4);
  const sx = new Float32Array(NP), sy = new Float32Array(NP), svx = new Float32Array(NP), svy = new Float32Array(NP);
  const slife = new Float32Array(NP), sml = new Float32Array(NP).fill(1), ssz = new Float32Array(NP);
  let sHead = 0, lpx = -1, lpy = -1;
  function spark(x, y, vx, vy, spread) {
    const i = sHead++ % NP, d = window.devicePixelRatio > 1 ? Math.min(window.devicePixelRatio, 2) : 1;
    sx[i] = x; sy[i] = y;
    svx[i] = vx * 0.2 + (Math.random() - 0.5) * spread * d;
    svy[i] = vy * 0.2 + (Math.random() - 0.5) * spread * d + 25 * d;
    slife[i] = 1; sml[i] = 0.7 + Math.random() * 1.0; ssz[i] = (2 + Math.random() * 6) * d;
  }
  function fxSparks(kind) {
    const d = Math.min(window.devicePixelRatio || 1, 2);
    const x = lpx >= 0 ? lpx : cv.width / 2, y = lpx >= 0 ? lpy : cv.height * (1 - CY);
    if (kind === 0) {          // ring
      for (let k = 0; k < 28; k++) { const a = k / 28 * TAU, v = (120 + Math.random() * 120) * d * 5; spark(x, y, Math.cos(a) * v, Math.sin(a) * v, 20); }
    } else if (kind === 1) {   // spiral: angle grows with speed, so the sparks trace spiral arms
      for (let k = 0; k < 48; k++) { const a = k * 0.45, v = (40 + k * 4.5) * d * 5; spark(x, y, Math.cos(a) * v, Math.sin(a) * v, 4); }
    } else {                   // heart-shaped burst
      for (let k = 0; k < 44; k++) {
        const t = k / 44 * TAU, hx = 16 * Math.pow(Math.sin(t), 3);
        const hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
        spark(x, y, hx * 100 * d, hy * 100 * d, 0);
      }
    }
  }
  window.addEventListener('pointermove', e => {
    const d = Math.min(window.devicePixelRatio || 1, 2), x = e.clientX * d, y = (innerHeight - e.clientY) * d;
    if (lpx >= 0) {
      const dx = x - lpx, dy = y - lpy, n = Math.min(8, Math.ceil(Math.hypot(dx, dy) / (12 * d)));
      for (let k = 0; k < n; k++) spark(lpx + dx * (k + 1) / n, lpy + dy * (k + 1) / n, dx * 20, dy * 20, 70);
    }
    lpx = x; lpy = y;
  });
  window.addEventListener('pointerleave', () => { lpx = -1; });
  window.addEventListener('pointerdown', e => {
    const d = Math.min(window.devicePixelRatio || 1, 2), x = e.clientX * d, y = (innerHeight - e.clientY) * d;
    lpx = x; lpy = y;
  });
  let parX = 0, parY = 0, tpX = 0, tpY = 0, fx = 0;
  window.addEventListener('pointermove', e => { tpX = (e.clientX / innerWidth - 0.5) * 2; tpY = -(e.clientY / innerHeight - 0.5) * 2; });

  const tri = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, tri);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const buf = gl.createBuffer();
  const silBuf = gl.createBuffer();

  /* ---------- heart cloud ---------- */
  // Implicit heart surface; z is the vertical axis. Most points sit in a thin shell under the surface.
  function hf(x, y, z) {
    const a = x * x + 2.25 * y * y + z * z - 1;
    return a * a * a - x * x * z * z * z - 0.1125 * y * y * z * z * z;
  }
  function sampleHeart(n) {
    const out = new Float32Array(n * 3);
    const nSil = Math.round(n * 0.5), nInner = Math.round(n * 0.15), nShell = n - nSil - nInner;
    let sil = 0, shell = 0, inner = 0, i = 0, guard = 0;
    const e = 0.01;
    const put = (x, y, z) => {
      out[i * 3] = x;
      out[i * 3 + 1] = z - 0.125; // up
      out[i * 3 + 2] = y;         // depth
      i++;
    };
    // Half of the points are spread evenly over the heart's outline as seen from the front,
    // on its front or back surface, so the rounded tops get as many as the middle.
    while (sil < nSil && guard < 4e6) {
      guard++;
      const x = (Math.random() * 2 - 1) * 1.3;
      const z = -1.2 + Math.random() * 2.7;
      if (hf(x, 0, z) >= 0) continue;
      const A = x * x + z * z - 1, B = x * x * z * z * z, C = 0.1125 * z * z * z;
      let lo = 0, hi = 0.7;
      for (let k = 0; k < 22; k++) {
        const w = (lo + hi) / 2, a = A + 2.25 * w;
        if (a * a * a - B - C * w < 0) lo = w; else hi = w;
      }
      const y = Math.sqrt((lo + hi) / 2) * (Math.random() < 0.5 ? -1 : 1) + (Math.random() - 0.5) * 0.06;
      put(x + (Math.random() - 0.5) * 0.02, y, z + (Math.random() - 0.5) * 0.02);
      sil++;
    }
    guard = 0;
    while ((shell < nShell || inner < nInner) && guard < 4e7) {
      guard++;
      const x = (Math.random() * 2 - 1) * 1.3;
      const y = (Math.random() * 2 - 1) * 0.8;
      const z = -1.2 + Math.random() * 2.7;
      const f = hf(x, y, z);
      if (f >= 0) continue;
      let take = false;
      if (shell < nShell && f > -0.3) {
        const gx = (hf(x + e, y, z) - hf(x - e, y, z)) / (2 * e);
        const gy = (hf(x, y + e, z) - hf(x, y - e, z)) / (2 * e);
        const gz = (hf(x, y, z + e) - hf(x, y, z - e)) / (2 * e);
        const d = -f / (Math.hypot(gx, gy, gz) || 1);
        if (d < 0.055) { take = true; shell++; }
      }
      if (!take && inner < nInner) { take = true; inner++; }
      if (take) put(x, y, z);
    }
    return { pts: out, n: i };
  }

  let COUNT = 0, heartData = null, nHeart = 0, textReady = false;
  function build(NH, NS) {
    const { pts, n } = sampleHeart(NH);
    const stride = 14;
    const data = new Float32Array((n + NS) * stride);
    let o = 0;
    for (let i = 0; i < n; i++) {
      const x = pts[i * 3], y = pts[i * 3 + 1], z = pts[i * 3 + 2];
      const h0 = Math.random();
      const arm = Math.floor(Math.random() * 3);
      const av0 = (arm * TAU) / 3 + h0 * 4.5 + (Math.random() - 0.5) * 0.9;
      const delay = clamp(0.7 * ((y + 1.15) / 2.4) + 0.3 * Math.random(), 0, 1);
      data[o++] = x; data[o++] = y; data[o++] = z;
      data[o++] = h0; data[o++] = av0 - Math.atan2(z, x); data[o++] = Math.random(); data[o++] = 0;
      data[o++] = delay; data[o++] = 1.8 + Math.pow(Math.random(), 2.2) * 4.4; data[o++] = Math.random(); data[o++] = Math.random();
      data[o++] = x; data[o++] = y; data[o++] = z; // lettering position, filled in once the font is ready
    }
    for (let j = 0; j < NS; j++) {
      o += 3; // heart position unused
      data[o++] = Math.random(); data[o++] = Math.random() * TAU; data[o++] = Math.random(); data[o++] = 1;
      data[o++] = 0; data[o++] = 1.8 + Math.pow(Math.random(), 2.2) * 4; data[o++] = Math.random(); data[o++] = Math.random();
      o += 3; // no lettering position
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    COUNT = n + NS;
    gl.bindBuffer(gl.ARRAY_BUFFER, silBuf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(COUNT * 4), gl.STATIC_DRAW);
    heartData = data;
    nHeart = n;
  }

  /* ---------- lettering ---------- */
  // The words are drawn on a hidden canvas; every heart particle then picks a random lit pixel as its spot in the text.
  async function prepareText() {
    try {
      await Promise.race([
        document.fonts.load('120px "Pacifico"', 'Люблю тебе Булка'),
        new Promise(r => setTimeout(r, 2500))
      ]);
    } catch (err) { /* the fallback script font is used */ }
    // tall screens get three stacked lines so the letters can be bigger
    const portrait = W < H * 0.8;
    const lines = portrait ? [['Люблю', 1], ['тебе', 0.8], ['Булка', 1.25]] : [['Люблю тебе', 1], ['Булка', 1.5]];
    const c = document.createElement('canvas');
    c.width = 1600; c.height = 1800;
    const g = c.getContext('2d');
    const fam = 'Pacifico, "Marck Script", "Lobster", cursive';
    g.fillStyle = '#fff';
    g.textAlign = 'center';
    g.textBaseline = 'alphabetic';
    g.font = '200px ' + fam;
    let base = 1e9;
    for (const [txt, mult] of lines) base = Math.min(base, (200 * 1300) / (g.measureText(txt).width * mult));
    let yb = 250 + base * lines[0][1] * 0.8, prev = base * lines[0][1];
    lines.forEach(([txt, mult], idx) => {
      const fs = base * mult;
      if (idx) yb += 0.5 * (prev + fs) * 1.1;
      g.font = fs + 'px ' + fam;
      g.fillText(txt, 800, yb);
      prev = fs;
    });
    const img = g.getImageData(0, 0, c.width, c.height).data;
    const xs = [], ys = [];
    let minX = 1e9, maxX = -1, minY = 1e9, maxY = -1;
    for (let y = 0; y < c.height; y++) {
      for (let x = 0; x < c.width; x++) {
        if (img[(y * c.width + x) * 4 + 3] > 128) {
          xs.push(x); ys.push(y);
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
        }
      }
    }
    if (!xs.length || !heartData) return;
    const unit = (maxX - minX) / 2, cxm = (minX + maxX) / 2, cym = (minY + maxY) / 2;
    const stride = 14;
    for (let i = 0; i < COUNT; i++) {
      const k = (Math.random() * xs.length) | 0;
      const o = i * stride + 11;
      heartData[o] = (xs[k] - cxm + (Math.random() - 0.5)) / unit;
      heartData[o + 1] = -(ys[k] - cym + (Math.random() - 0.5)) / unit;
      heartData[o + 2] = (Math.random() - 0.5) * 0.22;
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, heartData);
    textReady = true;
  }

    const im = new Image();
    im.onload = () => {
      const w = im.width, h = im.height;
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const g = c.getContext('2d');
      g.drawImage(im, 0, 0);
      const d = g.getImageData(0, 0, w, h).data;
      const px = [], cum = [];
      let tot = 0;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const o = (y * w + x) * 4;
        if (d[o] > 0) {
          const l = d[o + 1] / 255;
          px.push(x, y, d[o], l);
          tot += 0.3 + Math.pow(l, 1.5);
          cum.push(tot);
        }
      }
      const cnt = cum.length;
      if (!cnt || !COUNT) return;
      silAsp = w / h;
      const out = new Float32Array(COUNT * 4);
      const put = (i, k) => {
        const dz = (px[k + 2] - 1) / 254;
        out[i * 4] = ((px[k] + Math.random()) / w - 0.5) * 2 * silAsp;
        out[i * 4 + 1] = -((px[k + 1] + Math.random()) / h - 0.5) * 2;
        const rr = Math.random(), dd = dz * 0.4;
        // 45% front shell, 30% back shell, 25% fill inside the body (flagged by +10 in w)
        out[i * 4 + 2] = rr < 0.45 ? -(dd + 0.004 + Math.random() * 0.03) : rr < 0.75 ? dd + 0.004 + Math.random() * 0.03 : (Math.random() * 2 - 1) * dd;
        out[i * 4 + 3] = (0.12 + 2.2 * Math.pow(px[k + 3], 1.5)) * (1 + 0.9 * Math.max(0, 1 - dz * 3)) + (rr >= 0.75 ? 10 : 0);
      };
      // every pixel gets a share of the heart particles in proportion to its weight; stochastic rounding keeps the picture free of noise
      const per = nHeart / tot;
      let n0 = 0;
      for (let j = 0; j < cnt && n0 < nHeart; j++) {
        const q = per * (cum[j] - (j ? cum[j - 1] : 0));
        let n = Math.floor(q) + (Math.random() < q - Math.floor(q) ? 1 : 0);
        while (n-- > 0 && n0 < nHeart) put(n0++, j * 4);
      }
      while (n0 < COUNT) put(n0++, ((Math.random() * cnt) | 0) * 4);
      for (let u = nHeart - 1; u > 0; u--) {
        const v = (Math.random() * (u + 1)) | 0;
        for (let m2 = 0; m2 < 4; m2++) { const t = out[u * 4 + m2]; out[u * 4 + m2] = out[v * 4 + m2]; out[v * 4 + m2] = t; }
      }
      gl.bindBuffer(gl.ARRAY_BUFFER, silBuf);
      gl.bufferData(gl.ARRAY_BUFFER, out, gl.STATIC_DRAW);
      silReady = true;
    };
    im.src = SIL_SRC;
  }

  /* ---------- viewport ---------- */
  const CY = 0.47, FOV = 3.4, TILT = 0.2;
  let W = 0, H = 0, DPR = 1, S = 200, SIZE = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth || window.innerWidth;
    H = cv.clientHeight || window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    gl.viewport(0, 0, cv.width, cv.height);
    S = Math.min(W * 0.39, H * 0.28);
    SIZE = Math.max(0.75, S / 230);
  }

  /* ---------- interaction ---------- */
  const AUTO = reduce ? 0.06 : 0.38;
  let rotY = 0.4, rotX = TILT, velY = AUTO;
  let dragging = false, lx = 0, ly = 0, moved = 0, downT = 0, lastMoveT = 0;
  let burstStart = -1, flash = 0, time = 0;
  let mode = 0, morph = 0, morphFrom = 0, morphStart = 1e9, sil = 0, silFrom = 0; // mode 0 = heart, 1 = lettering

  // Each tap scatters the cloud, and it settles back as the other shape.
  function burst() {
    if (time < 7) return; // wait until the heart has formed
    burstStart = time;
    flash = 1;
    if (textReady) {
      mode = (mode + 1) % (silReady ? 3 : 2); // heart > lettering > silhouette > heart
      morphFrom = morph; silFrom = sil; morphStart = time + 0.3;
    }
    // each transition gets its own effect: lettering = spiral, photo = heart pulse, back to heart = ring
    fx = textReady ? (mode === 1 ? 1 : mode === 2 ? 2 : 0) : 0;
    fxSparks(fx);
  }
  cv.addEventListener('pointerdown', e => {
    dragging = true; moved = 0; lx = e.clientX; ly = e.clientY;
    downT = performance.now(); lastMoveT = downT;
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
    cv.classList.add('grabbing');
  });
  cv.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - lx, dy = e.clientY - ly;
    lx = e.clientX; ly = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    rotY += dx * 0.008;
    rotX = clamp(rotX + dy * 0.005, -0.9, 1.1);
    const now = performance.now();
    velY = clamp((dx * 0.008) / (Math.max(8, now - lastMoveT) / 1000), -8, 8);
    lastMoveT = now;
  });
  function endDrag() {
    if (!dragging) return false;
    dragging = false;
    cv.classList.remove('grabbing');
    if (performance.now() - lastMoveT > 90) velY = 0;
    return true;
  }
  cv.addEventListener('pointerup', () => {
    if (endDrag() && moved < 8 && performance.now() - downT < 400) burst();
  });
  cv.addEventListener('pointercancel', endDrag);
  cv.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); burst(); }
  });

  /* ---------- frame ---------- */
  let last = 0;
  const C0 = [0.859, 0.153, 0.467], C1 = [0.957, 0.447, 0.714], C2 = [0.984, 0.812, 0.91];
  const GLOW = [0.925, 0.282, 0.6];

  function frame(now) {
    requestAnimationFrame(frame);
    if (!last) last = now;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    time += dt;

    if (!dragging) {
      if (mode > 0) {
        // the lettering turns to face the viewer and only sways a little
        const base = Math.round(rotY / TAU) * TAU;
        rotY += (base + Math.sin(time * 0.7) * (mode === 2 ? 0.3 : 0.4) - rotY) * Math.min(1, dt * 2.2);
        velY = 0;
        rotX += (0.12 - rotX) * Math.min(1, dt * 1.6);
      } else {
        velY += (AUTO - velY) * Math.min(1, dt * 1.6);
        rotY += velY * dt;
        rotX += (TILT - rotX) * Math.min(1, dt * 1.4);
      }
    }
    if (time > morphStart) {
      const kk = clamp((time - morphStart) / 2.2, 0, 1);
      morph = morphFrom + ((mode > 0 ? 1 : 0) - morphFrom) * kk;
      sil = silFrom + ((mode === 2 ? 1 : 0) - silFrom) * kk;
    }
    flash *= Math.exp(-dt * 2.2);

    // timeline: swirl for about two seconds, then the vortex folds into the heart
    const prog = clamp((time - 1.8) / 5.5, 0, 1);
    const intro = smooth(0, 0.9, time);
    let beat = 0;
    if (!reduce) {
      const p = time % 1.25;
      beat = Math.exp(-p * 9) + 0.55 * Math.exp(-Math.pow((p - 0.32) * 9, 2));
    }
    const uBeat = 1 + 0.045 * beat * clamp((prog - 0.9) / 0.1, 0, 1);
    const bt = burstStart >= 0 && time - burstStart < 6 ? time - burstStart : -1;

    gl.clearColor(0.0275, 0.0118, 0.0392, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.disable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE);

    parX += (tpX - parX) * Math.min(1, dt * 2); parY += (tpY - parY) * Math.min(1, dt * 2);
    gl.useProgram(BG);
    gl.uniform2f(BU.uR, cv.width, cv.height);
    gl.uniform2f(BU.uC, cv.width / 2, cv.height * (1 - CY));
    gl.uniform2f(BU.uPar, parX, parY);
    gl.uniform1f(BU.uT, time);
    gl.uniform1f(BU.uFx, fx);
    gl.uniform1f(BU.uRing, bt >= 0 && bt < 2.5 ? bt / 2.5 : -1);
    gl.bindBuffer(gl.ARRAY_BUFFER, tri);
    gl.enableVertexAttribArray(bP);
    gl.vertexAttribPointer(bP, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.disableVertexAttribArray(bP);
    gl.useProgram(ST);
    gl.uniform1f(SU.uT, time); gl.uniform1f(SU.uDPR, DPR); gl.uniform2f(SU.uPar, parX, parY);
    gl.bindBuffer(gl.ARRAY_BUFFER, starBuf);
    gl.enableVertexAttribArray(sA);
    gl.vertexAttribPointer(sA, 3, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.POINTS, 0, NSTAR);
    gl.disableVertexAttribArray(sA);

    // glow under the heart
    const cb = Math.cos(rotX), sb = Math.sin(rotX);
    const kb = FOV / (FOV + 1.4 * sb);
    const g = smooth(0.3, 1, prog);
    const rx = (0.55 + 0.55 * g) * S * DPR;
    const ry = rx * Math.max(0.14, Math.abs(Math.sin(rotX)));
    gl.useProgram(G);
    gl.uniform2f(GU.uC, (W / 2) * DPR, (H * (1 - CY) - 1.4 * cb * kb * S) * DPR);
    gl.uniform2f(GU.uR, rx, ry);
    gl.uniform1f(GU.uK, (0.18 + 0.82 * g) * (1 + flash * 0.8) * intro * (1 - 0.85 * sil));
    gl.uniform3f(GU.uColor, GLOW[0], GLOW[1], GLOW[2]);
    gl.bindBuffer(gl.ARRAY_BUFFER, tri);
    gl.enableVertexAttribArray(gP);
    gl.vertexAttribPointer(gP, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.disableVertexAttribArray(gP);

    // particles
    gl.useProgram(P);
    gl.uniform1f(U.uTime, time);
    gl.uniform1f(U.uProg, prog);
    gl.uniform1f(U.uBeat, uBeat);
    gl.uniform1f(U.uRotY, rotY);
    gl.uniform1f(U.uRotX, rotX);
    gl.uniform1f(U.uBurstT, bt);
    gl.uniform1f(U.uS, S);
    gl.uniform1f(U.uDPR, DPR);
    gl.uniform1f(U.uSize, SIZE);
    gl.uniform1f(U.uIntro, intro);
    gl.uniform1f(U.uBoost, (1 + flash * 0.5) * dim);
    gl.uniform1f(U.uMorph, morph);
    gl.uniform1f(U.uSil, sil);
    gl.uniform1f(U.uSilScale, Math.min(0.43 * H / S, 0.42 * W / (S * silAsp)));
    gl.uniform1f(U.uTextScale, Math.min(1.75, ((W / 2 - 18) / S) * 0.95));
    gl.uniform2f(U.uView, W, H);
    gl.uniform2f(U.uCenter, 0, 1 - 2 * CY);
    gl.uniform3f(U.uC0, C0[0], C0[1], C0[2]);
    gl.uniform3f(U.uC1, C1[0], C1[1], C1[2]);
    gl.uniform3f(U.uC2, C2[0], C2[1], C2[2]);
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    const STRIDE = 56;
    gl.enableVertexAttribArray(aHeart);
    gl.vertexAttribPointer(aHeart, 3, gl.FLOAT, false, STRIDE, 0);
    gl.enableVertexAttribArray(aV);
    gl.vertexAttribPointer(aV, 4, gl.FLOAT, false, STRIDE, 12);
    gl.enableVertexAttribArray(aR);
    gl.vertexAttribPointer(aR, 4, gl.FLOAT, false, STRIDE, 28);
    gl.enableVertexAttribArray(aText);
    gl.vertexAttribPointer(aText, 3, gl.FLOAT, false, STRIDE, 44);
    gl.bindBuffer(gl.ARRAY_BUFFER, silBuf);
    gl.enableVertexAttribArray(aSil);
    gl.vertexAttribPointer(aSil, 4, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.POINTS, 0, COUNT);

    // cursor sparks
    const damp = Math.exp(-dt * 2.2);
    for (let i = 0; i < NP; i++) {
      if (slife[i] > 0) {
        slife[i] -= dt / sml[i];
        sx[i] += svx[i] * dt; sy[i] += svy[i] * dt;
        svx[i] *= damp; svy[i] *= damp; svy[i] += 30 * DPR * dt;
      }
      const l = Math.max(slife[i], 0);
      spOut[i * 4] = sx[i]; spOut[i * 4 + 1] = sy[i];
      spOut[i * 4 + 2] = ssz[i] * (0.4 + 0.6 * l); spOut[i * 4 + 3] = l * l * (0.7 + 0.3 * Math.sin(time * 18 + i));
    }
    gl.useProgram(CP);
    gl.uniform2f(cU, cv.width, cv.height);
    gl.bindBuffer(gl.ARRAY_BUFFER, spBuf);
    gl.bufferData(gl.ARRAY_BUFFER, spOut, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(cA);
    gl.vertexAttribPointer(cA, 4, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.POINTS, 0, NP);
    gl.disableVertexAttribArray(cA);
  }

  /* ---------- start ---------- */
  resize();
  window.addEventListener('resize', resize);
  if (W < 600) { build(70000, 6000); dim = 0.62; } else { build(120000, 9000); dim = 0.55; }
  prepareText();
  prepareSil();
  requestAnimationFrame(frame);
})();
</script>

</body></html>
